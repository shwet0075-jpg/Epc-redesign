<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury 3D Morphing Contact Menu | Prudent EPC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       THEME SYSTEM & DESIGN TOKENS
       ========================================================================== */
    :root {
      /* Default Brand Palette: Deep Green & Radiant Orange */
      --green-100: #d4ede0;
      --green-400: #108e4e;
      --green-700: #006030;
      --green-900: #022312;

      --accent-100: #ffeedd;
      --accent-300: #fba45c;
      --accent-500: #F08020;
      --accent-700: #b55406;

      --bg-gradient-start: #062315;
      --bg-gradient-end: #010a05;

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

      --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --spring-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Preset Palettes */
    [data-theme="navy-gold"] {
      --green-100: #e2e8f0;
      --green-400: #1e3a8a;
      --green-700: #0f172a;
      --green-900: #030712;
      --accent-100: #fef3c7;
      --accent-300: #fde047;
      --accent-500: #d4af37;
      --accent-700: #92400e;
      --bg-gradient-start: #0a192f;
      --bg-gradient-end: #020617;
    }

    [data-theme="oxblood-rose"] {
      --green-100: #fce7f3;
      --green-400: #831843;
      --green-700: #4a0e17;
      --green-900: #1f0408;
      --accent-100: #ffe4e6;
      --accent-300: #fda4af;
      --accent-500: #e07a68;
      --accent-700: #9f1239;
      --bg-gradient-start: #2a070e;
      --bg-gradient-end: #0a0103;
    }

    [data-theme="graphite-platinum"] {
      --green-100: #f4f4f5;
      --green-400: #52525b;
      --green-700: #27272a;
      --green-900: #09090b;
      --accent-100: #ffffff;
      --accent-300: #e4e4e7;
      --accent-500: #a1a1aa;
      --accent-700: #71717a;
      --bg-gradient-start: #18181b;
      --bg-gradient-end: #050505;
    }

    [data-theme="teal-amber"] {
      --green-100: #ccfbf1;
      --green-400: #0d9488;
      --green-700: #00363a;
      --green-900: #001e21;
      --accent-100: #fef3c7;
      --accent-300: #fcd34d;
      --accent-500: #ffb300;
      --accent-700: #b45309;
      --bg-gradient-start: #002b2e;
      --bg-gradient-end: #000d0e;
    }

    /* ==========================================================================
       PAGE SHELL & LUXURY DARK VIGNETTE
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: 
        radial-gradient(ellipse 70% 60% at 50% 50%, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      color: #ffffff;
      font-family: var(--font-sans);
      overflow-x: hidden;
      perspective: 1200px;
      transition: background 0.8s ease;
    }

    /* Subtle Architectural Grain Overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: center;
      pointer-events: none;
      opacity: 0.65;
    }

    /* ==========================================================================
       PALETTE PICKER TOOLBAR (HIGH-END MINIMAL HEADER)
       ========================================================================== */
    .luxury-header {
      position: fixed;
      top: 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 100;
    }

    .palette-title {
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
    }

    .palette-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-chip {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      position: relative;
      transition: transform 0.25s var(--spring-bounce), border-color 0.25s;
    }

    .theme-chip:hover {
      transform: scale(1.25);
      border-color: #ffffff;
    }

    .theme-chip.active {
      border-color: #ffffff;
      transform: scale(1.2);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .theme-chip--brand { background: linear-gradient(135deg, #006030 50%, #F08020 50%); }
    .theme-chip--navy { background: linear-gradient(135deg, #0f172a 50%, #d4af37 50%); }
    .theme-chip--oxblood { background: linear-gradient(135deg, #4a0e17 50%, #e07a68 50%); }
    .theme-chip--graphite { background: linear-gradient(135deg, #27272a 50%, #e4e4e7 50%); }
    .theme-chip--teal { background: linear-gradient(135deg, #00363a 50%, #ffb300 50%); }

    /* ==========================================================================
       THE 3D MORPHING CONTACT STAGE
       ========================================================================== */
    .morph-menu-stage {
      position: relative;
      width: 320px;
      height: 280px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      user-select: none;
    }

    /* Soft Elliptical Ground Cast Shadow that widens when menu opens */
    .ground-cast-shadow {
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 72px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(8px);
      transition: width 0.6s var(--spring-smooth), height 0.6s var(--spring-smooth), opacity 0.6s ease;
      pointer-events: none;
      z-index: 1;
    }

    .morph-menu-stage.is-open .ground-cast-shadow {
      width: 240px;
      height: 26px;
      opacity: 0.95;
      filter: blur(12px);
    }

    /* Trigger Button 3D Container */
    .trigger-container {
      position: relative;
      z-index: 20;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    /* Circular Button 2-Layer Construction: Metallic Bezel + Concave Dome */
    .luxury-btn {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: transparent;

      /* Heavy Layered Extrusion Shadows */
      box-shadow: 
        0 1px 2px rgba(0, 0, 0, 0.45),                 /* Thin dark rim */
        0 8px 18px -2px rgba(0, 0, 0, 0.6),              /* Thicker drop shadow beneath */
        0 18px 36px -6px rgba(0, 0, 0, 0.5),             /* Soft ambient shadow */
        0 0 24px rgba(var(--green-700), 0.3);

      transition: transform 0.35s var(--spring-bounce), box-shadow 0.35s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .luxury-btn:focus-visible {
      outline: 2px solid var(--accent-300);
      outline-offset: 5px;
    }

    /* On :active, physically reduce extrusion */
    .luxury-btn:active {
      transform: scale(0.94) translateY(3px) !important;
      box-shadow: 
        0 1px 2px rgba(0, 0, 0, 0.6),
        0 3px 8px rgba(0, 0, 0, 0.7),
        0 6px 14px rgba(0, 0, 0, 0.4);
    }

    /* Layer 1: Outer Machined Conic Bezel */
    .btn-bezel {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 210deg at 50% 50%,
        rgba(255, 255, 255, 0.45) 0deg,
        rgba(240, 128, 32, 0.2) 60deg,
        rgba(0, 0, 0, 0.7) 120deg,
        rgba(255, 255, 255, 0.4) 180deg,
        rgba(0, 96, 48, 0.3) 240deg,
        rgba(0, 0, 0, 0.75) 300deg,
        rgba(255, 255, 255, 0.45) 360deg
      );
      padding: 3.5px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.55), inset 0 -2px 3px rgba(0, 0, 0, 0.6);
      transition: all 0.5s ease;
    }

    /* Layer 2: Inner Concave Dome Face */
    .btn-dome {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(
        circle at 35% 28%,
        var(--green-400) 0%,
        var(--green-700) 45%,
        var(--green-900) 100%
      );
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        inset 0 4px 8px rgba(255, 255, 255, 0.28),      /* Top-left specular highlight */
        inset 0 -5px 12px rgba(0, 0, 0, 0.75),           /* Deep base inner shadow */
        inset 2px 2px 4px rgba(255, 255, 255, 0.2);
      transition: background 0.5s ease, box-shadow 0.4s ease;
    }

    /* Specular Light Sweep Across Upper Dome */
    .btn-dome::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 10%;
      width: 80%;
      height: 38%;
      border-radius: 50% 50% 45% 45% / 60% 60% 30% 30%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
    }

    /* Active open trigger state */
    .morph-menu-stage.is-open .trigger-btn .btn-dome {
      background: radial-gradient(
        circle at 35% 28%,
        var(--accent-300) 0%,
        var(--accent-500) 45%,
        var(--accent-700) 100%
      );
    }

    /* ==========================================================================
       KINETIC MORPHING GLYPH: 3 DOTS -> ROTATING 'X'
       ========================================================================== */
    .glyph-box {
      position: relative;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* Three Dots (Shown in closed state) */
    .dots-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 20px;
      height: 6px;
      position: absolute;
      transition: transform 0.45s var(--spring-bounce), opacity 0.35s ease;
    }

    .dot {
      width: 4.5px;
      height: 4.5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.85);
      transition: transform 0.4s var(--spring-bounce), opacity 0.3s ease;
    }

    /* In open state: Dots shrink & fade away */
    .morph-menu-stage.is-open .dots-group {
      transform: scale(0);
      opacity: 0;
    }

    /* Two Hidden Crossing Bars (Morph into X) */
    .bar {
      position: absolute;
      width: 18px;
      height: 2.8px;
      border-radius: 2px;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      transform: scaleX(0) rotate(0deg);
      opacity: 0;
      transition: transform 0.5s var(--spring-bounce), opacity 0.35s ease;
    }

    .bar-1 {
      transform: scaleX(0) rotate(0deg);
    }

    .bar-2 {
      transform: scaleX(0) rotate(0deg);
    }

    /* In open state: Bars expand & rotate into crossing 'X' */
    .morph-menu-stage.is-open .bar-1 {
      transform: scaleX(1) rotate(45deg);
      opacity: 1;
    }

    .morph-menu-stage.is-open .bar-2 {
      transform: scaleX(1) rotate(-45deg);
      opacity: 1;
    }

    /* ==========================================================================
       6 SATELLITE ICON BUTTONS (SEMICIRCULAR ARC FAN-OUT)
       ========================================================================== */
    .satellites-orbit {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 68px;
      height: 68px;
      pointer-events: none;
      z-index: 10;
    }

    .morph-menu-stage.is-open .satellites-orbit {
      pointer-events: auto;
    }

    .satellite-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 52px;
      height: 52px;
      margin-top: 8px;
      margin-left: 8px;
      transform: translate(0, 0) scale(0);
      opacity: 0;
      transition: transform 0.55s var(--spring-bounce), opacity 0.4s ease;
    }

    /* Satellite Button Layer 2: Orange Accent Base with White Glyphs */
    .satellite-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      box-shadow: 
        0 1px 2px rgba(0, 0, 0, 0.4),
        0 6px 16px -2px rgba(0, 0, 0, 0.55),
        0 12px 24px -4px rgba(0, 0, 0, 0.4),
        0 0 16px rgba(var(--accent-500), 0.35);
    }

    .satellite-btn .btn-bezel {
      padding: 3px;
      background: conic-gradient(
        from 210deg at 50% 50%,
        rgba(255, 255, 255, 0.5) 0deg,
        rgba(255, 255, 255, 0.1) 60deg,
        rgba(0, 0, 0, 0.65) 120deg,
        rgba(255, 255, 255, 0.45) 180deg,
        rgba(240, 128, 32, 0.35) 240deg,
        rgba(0, 0, 0, 0.7) 300deg,
        rgba(255, 255, 255, 0.5) 360deg
      );
    }

    .satellite-btn .btn-dome {
      background: radial-gradient(
        circle at 35% 28%,
        var(--accent-300) 0%,
        var(--accent-500) 45%,
        var(--accent-700) 100%
      );
      color: #ffffff;
      box-shadow: 
        inset 0 3px 6px rgba(255, 255, 255, 0.45),
        inset 0 -4px 10px rgba(0, 0, 0, 0.65),
        inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.25);
    }

    .satellite-icon {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      position: relative;
      z-index: 5;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
      transition: transform 0.25s var(--spring-bounce);
    }

    .satellite-btn:hover .satellite-icon {
      transform: scale(1.18);
    }

    /* ==========================================================================
       SEMICIRCULAR ARC GEOMETRY & STAGGERED CASCADE DELAYS
       Radius = 126px, Angle spread = 180 degrees (from 180 to 0)
       i = 0 (far left, 180°): dx = -126px, dy = 0px
       i = 1 (144°): dx = -102px, dy = -74px
       i = 2 (108°): dx = -39px, dy = -120px
       i = 3 (72°):  dx = +39px, dy = -120px
       i = 4 (36°):  dx = +102px, dy = -74px
       i = 5 (0°):   dx = +126px, dy = 0px
       ========================================================================== */

    /* Closing Delays (Collapse backwards smoothly) */
    .satellite-item:nth-child(1) { transition-delay: 0ms; }
    .satellite-item:nth-child(2) { transition-delay: 25ms; }
    .satellite-item:nth-child(3) { transition-delay: 50ms; }
    .satellite-item:nth-child(4) { transition-delay: 75ms; }
    .satellite-item:nth-child(5) { transition-delay: 100ms; }
    .satellite-item:nth-child(6) { transition-delay: 125ms; }

    /* Open Semicircular Arc Coordinates & Staggered Cascade */
    .morph-menu-stage.is-open .satellite-item:nth-child(1) {
      transform: translate(-128px, 0px) scale(1);
      opacity: 1;
      transition-delay: 40ms;
    }

    .morph-menu-stage.is-open .satellite-item:nth-child(2) {
      transform: translate(-104px, -76px) scale(1);
      opacity: 1;
      transition-delay: 90ms;
    }

    .morph-menu-stage.is-open .satellite-item:nth-child(3) {
      transform: translate(-38px, -122px) scale(1);
      opacity: 1;
      transition-delay: 140ms;
    }

    .morph-menu-stage.is-open .satellite-item:nth-child(4) {
      transform: translate(38px, -122px) scale(1);
      opacity: 1;
      transition-delay: 190ms;
    }

    .morph-menu-stage.is-open .satellite-item:nth-child(5) {
      transform: translate(104px, -76px) scale(1);
      opacity: 1;
      transition-delay: 240ms;
    }

    .morph-menu-stage.is-open .satellite-item:nth-child(6) {
      transform: translate(128px, 0px) scale(1);
      opacity: 1;
      transition-delay: 290ms;
    }

    /* ==========================================================================
       EDITORIAL SERIF TOOLTIP (CORMORANT GARAMOND)
       ========================================================================== */
    .luxury-tooltip {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(4px) scale(0.92);
      font-family: var(--font-display);
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
      color: #ffffff;
      background: rgba(4, 20, 11, 0.88);
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s var(--spring-bounce);
      z-index: 30;
    }

    /* Hairline Arrow Pointer */
    .luxury-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 4px;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.22) transparent transparent transparent;
    }

    /* Hover Reveal */
    .satellite-btn:hover .luxury-tooltip,
    .satellite-btn:focus-visible .luxury-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* Footer Label */
    .stage-caption {
      margin-top: 36px;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-style: italic;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      transition: color 0.3s ease;
    }

    /* ==========================================================================
       ACCESSIBILITY & PREFERS-REDUCED-MOTION
       ========================================================================== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .trigger-container {
        transform: none !important;
      }
    }

    /* Responsive adjustments for mobile screens */
    @media (max-width: 480px) {
      .morph-menu-stage {
        width: 290px;
        height: 250px;
      }

      .luxury-btn {
        width: 60px;
        height: 60px;
      }

      .satellite-btn {
        width: 46px;
        height: 46px;
      }

      .morph-menu-stage.is-open .satellite-item:nth-child(1) { transform: translate(-106px, 0px) scale(1); }
      .morph-menu-stage.is-open .satellite-item:nth-child(2) { transform: translate(-86px, -62px) scale(1); }
      .morph-menu-stage.is-open .satellite-item:nth-child(3) { transform: translate(-32px, -102px) scale(1); }
      .morph-menu-stage.is-open .satellite-item:nth-child(4) { transform: translate(32px, -102px) scale(1); }
      .morph-menu-stage.is-open .satellite-item:nth-child(5) { transform: translate(86px, -62px) scale(1); }
      .morph-menu-stage.is-open .satellite-item:nth-child(6) { transform: translate(106px, 0px) scale(1); }
    }
  </style>
</head>
<body>

  <!-- THEME SWITCHER TOOLBAR -->
  <header class="luxury-header" aria-label="Theme Selection">
    <span class="palette-title">Palette</span>
    <div class="palette-switcher">
      <button type="button" class="theme-chip theme-chip--brand active" data-theme="brand" title="Brand: Deep Green & Radiant Orange" aria-label="Brand theme"></button>
      <button type="button" class="theme-chip theme-chip--navy" data-theme="navy-gold" title="Navy & Imperial Gold" aria-label="Navy and Gold theme"></button>
      <button type="button" class="theme-chip theme-chip--oxblood" data-theme="oxblood-rose" title="Oxblood & Rose Gold" aria-label="Oxblood theme"></button>
      <button type="button" class="theme-chip theme-chip--graphite" data-theme="graphite-platinum" title="Graphite & Platinum" aria-label="Graphite theme"></button>
      <button type="button" class="theme-chip theme-chip--teal" data-theme="teal-amber" title="Deep Teal & Amber" aria-label="Teal theme"></button>
    </div>
  </header>

  <!-- THE 3D MORPHING CONTACT STAGE -->
  <main class="morph-menu-stage" id="morphMenuStage">
    
    <!-- Cast shadow on the ground that widens on open -->
    <div class="ground-cast-shadow" aria-hidden="true"></div>

    <!-- 6 SATELLITE ICON BUTTONS IN SEMICIRCULAR ARC -->
    <div class="satellites-orbit" aria-label="Contact channels">
      
      <!-- 1. WhatsApp -->
      <div class="satellite-item">
        <a href="https://wa.me/8369640531" target="_blank" rel="noopener noreferrer" class="luxury-btn satellite-btn" aria-label="Chat on WhatsApp">
          <div class="btn-bezel">

  <!-- ==========================================================================
       VANILLA JAVASCRIPT: TILT, MORPH, KEYBOARD & OUTSIDE CLICK
       Zero External Libraries
       ========================================================================== */ -->
  <script>
    (function () {
      'use strict';

      const stage = document.getElementById('morphMenuStage');
      const triggerBtn = document.getElementById('triggerBtn');
      const triggerContainer = document.getElementById('triggerContainer');
      const themeChips = document.querySelectorAll('.theme-chip');

      let isOpen = false;

      // Toggle Menu
      function toggleMenu() {
        isOpen = !isOpen;
        stage.classList.toggle('is-open', isOpen);
        triggerBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        triggerBtn.setAttribute('aria-label', isOpen ? 'Close contact channels menu' : 'Open contact channels menu');

        if (isOpen) {
          // Reset 3D tilt when menu is open
          triggerContainer.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
        }
      }

      function closeMenu() {
        if (isOpen) {
          isOpen = false;
          stage.classList.remove('is-open');
          triggerBtn.setAttribute('aria-expanded', 'false');
          triggerBtn.setAttribute('aria-label', 'Open contact channels menu');
          triggerContainer.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
        }
      }

      triggerBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleMenu();
      });

      // Escape key to close
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && isOpen) {
          closeMenu();
          triggerBtn.focus();
        }
      });

      // Click outside to close
      document.addEventListener('click', function (e) {
        if (isOpen && !stage.contains(e.target)) {
          closeMenu();
        }
      });

      // Subtle 3D Tilt on Cursor Position (When Closed)
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!prefersReducedMotion) {
        triggerContainer.addEventListener('mousemove', function (e) {
          if (isOpen) return;

          const rect = triggerContainer.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          const deltaX = e.clientX - centerX;
          const deltaY = e.clientY - centerY;

          const rotateX = (deltaY / (rect.height / 2)) * -14;
          const rotateY = (deltaX / (rect.width / 2)) * 14;

          triggerContainer.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
        });

        triggerContainer.addEventListener('mouseleave', function () {
          if (isOpen) return;
          triggerContainer.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
        });
      }

      // Palette Theme System
      themeChips.forEach(chip => {
        chip.addEventListener('click', function () {
          const theme = this.getAttribute('data-theme');
          themeChips.forEach(c => c.classList.remove('active'));
          this.classList.add('active');

          if (theme === 'brand') {
            document.documentElement.removeAttribute('data-theme');
          } else {
            document.documentElement.setAttribute('data-theme', theme);
          }
        });
      });

    })();
  </script>
